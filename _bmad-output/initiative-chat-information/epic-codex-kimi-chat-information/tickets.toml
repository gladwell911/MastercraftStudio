[[entry]]
id = 1
type = "story"
title = "打通聊天信息菜单、列表和 Codex 上下文"
description = "在应用菜单加入仅 Codex/Kimi 聊天可用的入口，建立独立键盘列表与 Esc 焦点恢复，以聊天、原生会话和账号身份作为后续数据源共用的更新契约，并用正确的 Codex 最近用量贯通第一行。"
verify = "Codex 聊天从应用菜单打开信息列表后可读到上下文百分比及 token 数；方向键与 Esc 正常，关闭后焦点回到原控件。"
covers = ["CAP-1", "CAP-2"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "接入 Codex 累计消耗和主周限额"
description = "解析 Codex 新旧 token 事件中的累计值，读取主 codex bucket 周窗口及重置时间，并显示账号和字段缺失状态。"
verify = "累计 token 与当前上下文占用分别显示；主 codex 周窗显示剩余比例和本地重置时间，API key 与缺周窗有正确状态。"
covers = ["CAP-3", "CAP-4", "CAP-7"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "接入 Kimi 上下文和会话累计消耗"
description = "将 Kimi 实时 status 的上下文数值接入列表，并从 session snapshot 读取输入加输出的累计 token，绑定正确会话。"
verify = "Kimi 聊天显示上下文百分比及已用／总窗口 token，累计值来自 snapshot；切换聊天和压缩上下文后数据正确。"
