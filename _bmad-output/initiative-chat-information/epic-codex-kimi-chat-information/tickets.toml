[[entry]]
id = 4
type = "story"
title = "接入 Kimi 额度及可见窗口刷新"
description = "读取 Kimi OAuth 五小时和七日额度，完成两种重置时间展示，并基于第 1 项的身份契约统一 Codex token/周额度及 Kimi status/snapshot/额度的可见刷新、任务完成与账号变化触发、失效回调丢弃和焦点保护。"
verify = "两家全部信息行在事件或后台快照变化后更新；Kimi 额度形式正确，账号不可用、网络失败、会话切换和关闭窗口时不串号，无变化时不触发 UI 更新或焦点变动。"
covers = ["CAP-5", "CAP-6", "CAP-7"]
after = [2, 3]
hitl = false
risk = "high"

[[entry]]
